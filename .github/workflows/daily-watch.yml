# 6時間ごとに全国のフィードを見て、記録を site ブランチにコミットし、site の中身を GitHub Pages に出す。
# コード（main）と、毎回の記録（site）の履歴は分ける。
#
# 呼ぶのは、ふだんは Cloudflare の定時の仕組み（通知のサーバー push/ の Worker が workflow_dispatch で呼ぶ）。
# GitHub の定時の実行（schedule）は、遅れたり抜けたりするので予備にする：
# 前の6時間のうちに、ほかの実行がもう始まっていれば、何もしないで終わる。
name: daily-watch
run-name: "daily-watch${{ (github.event.schedule == '47 18 * * 6' || inputs.full == true) && '（点検）' || '' }}${{ inputs.by == 'cloudflare' && '（Cloudflare から）' || '' }}"

on:
  schedule:
    - cron: "17 */6 * * *"   # 予備。6時間ごと。毎時0分を避ける（UTC 0:17/6:17/12:17/18:17 = 日本時間 9:17/15:17/21:17/3:17）
    - cron: "47 18 * * 6"    # 予備。週1回の点検（日本時間 日曜 3:47）：全フィードの版を取り直す
  workflow_dispatch:
    inputs:
      full:
        description: "全フィードの版を取り直す（点検）"
        type: boolean
        default: false
      by:
        description: "呼んだところ（Cloudflare の定時の仕組みは cloudflare）"
        type: string
        default: ""

permissions:
  contents: write   # site ブランチに push する
  pages: write      # GitHub Pages に出す
  id-token: write   # GitHub Pages に出す
  actions: read     # deploy-pages が、この実行の成果物（github-pages）を探すのに要る（v4 以降）

# 同時に2つは動かさない。前の回が動いているあいだに来た回は、終わるまで待つ。
# （GitHub の決まりで、待てるのは1つだけ。待っている回があるところに次が来ると、前に待っていた回は取り消される。
#   どちらも同じことをするので、困らない）
concurrency:
  group: daily-watch
  cancel-in-progress: false

jobs:
  # 0番目のジョブ：GitHub の定時の実行（予備）のときだけ、ほかの実行がもう始まっていないかを見る
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.look.outputs.skip }}
    steps:
      - id: look
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          FULL: ${{ github.event.schedule == '47 18 * * 6' }}
        run: |
          # 前の5時間50分のうちに始まった、ほかの実行（取り消し・失敗を除く）。点検の予備なら、点検の実行だけを数える
          since=$(date -u -d '350 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/daily-watch.yml/runs?created=%3E%3D${since}&per_page=50" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }})
                   | select(.conclusion == null or .conclusion == \"success\")
                   | select(env.FULL != \"true\" or (.display_title | contains(\"点検\")))] | length")
          echo "前の5時間50分のうちに始まった、ほかの実行：${n} 件"
          if [ "$n" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "もう動いているので、今回は何もしません"; fi

  # 1つ目のジョブ：見に行き、記録を site ブランチに入れ、公開するファイルを上げるまで
  watch:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: コード（main）を取り出す
        uses: actions/checkout@v7

      - name: 記録（site ブランチ）を取り出す
        run: |
          git fetch --depth=1 origin site
          git worktree add site origin/site
          cd site && git switch -c site

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 見に行く
        env:
          # 連絡先は Secrets から読む。GitHub は Secrets の値をログで伏せ字にする。スクリプトも表示しない
          GTFS_CONTACT: ${{ secrets.GTFS_CONTACT }}
          FULL: ${{ github.event.schedule == '47 18 * * 6' || inputs.full == true }}
        run: |
          if [ -z "$GTFS_CONTACT" ]; then echo "Secrets に GTFS_CONTACT がありません"; exit 1; fi
          test -f site/state/versions_seen.csv || { echo "site ブランチに記録がありません（最初の1回は手元で作る）"; exit 1; }
          if [ "$FULL" = "true" ]; then python3 scripts/07_daily_watch.py --site site --full
          else python3 scripts/07_daily_watch.py --site site; fi

      - name: 記録を site ブランチにコミットする
        if: always()
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "見に行った記録 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin site

      - name: 60日の対策：main に50日コミットが無ければ、中身の無いコミットを1つ入れる
        # 公開リポジトリでは、60日間動きが無いと定時実行が止まる。site ブランチへのコミットが
        # 「動き」に数えられるかは公式の説明で確かめられないので、main にも時々コミットする（案1）
        run: |
          git fetch --depth=1 origin main
          last=$(git log -1 --format=%ct origin/main)
          days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "main の最後のコミットから ${days} 日"
          if [ "$days" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -q -m "定時実行を止めないための中身の無いコミット（main に${days}日コミットが無かったため）"
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # 2つ目のジョブ：Pages に出す・知らせを送る（1つ目が終わってから。GitHub の標準の形）
  deploy:
    needs: watch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true   # 失敗したら、下で1回だけやり直す

      - name: Pages に出せなかったので、少し待つ
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - id: deploy_retry
        name: Pages に出す（やり直しの1回）
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: コード（main）を取り出す
        if: steps.deploy.outcome == 'success' || steps.deploy_retry.outcome == 'success'
        uses: actions/checkout@v7

      - name: 記録（site ブランチ）を取り出す（1つ目のジョブが入れたあとのもの）
        if: steps.deploy.outcome == 'success' || steps.deploy_retry.outcome == 'success'
        run: |
          git fetch --depth=1 origin site
          git worktree add site origin/site
          cd site && git switch -c site

      - uses: actions/setup-python@v7
        if: steps.deploy.outcome == 'success' || steps.deploy_retry.outcome == 'success'
        with:
          python-version: "3.12"

      - id: notify
        name: 知らせを送る（Pages に出せたときだけ。通知のサーバーが設定されているときだけ）
        if: steps.deploy.outcome == 'success' || steps.deploy_retry.outcome == 'success'
        env:
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
        run: python3 scripts/10_notify.py --site site

      - name: 待ち行列を site ブランチにコミットする
        if: always() && (steps.notify.outcome == 'success' || steps.notify.outcome == 'failure')
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state/notify_queue.json 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "知らせを送った記録 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin site
