# 下書き：了承をいただいたら .github/workflows/daily-watch.yml に移す（それまでは動かない）
#
# 6時間ごとに全国のフィードを見て、記録を site ブランチにコミットし、site の中身を GitHub Pages に出す。
# コード（main）と、毎回の記録（site）の履歴は分ける。
name: daily-watch

on:
  schedule:
    - cron: "17 */6 * * *"   # 6時間ごと。毎時0分を避ける（UTC 0:17/6:17/12:17/18:17 = 日本時間 9:17/15:17/21:17/3:17）
    - cron: "47 18 * * 6"    # 週1回の点検（日本時間 日曜 3:47）：全フィードの版を取り直す
  workflow_dispatch:
    inputs:
      full:
        description: "全フィードの版を取り直す（点検）"
        type: boolean
        default: false

permissions:
  contents: write   # site ブランチに push する
  pages: write      # GitHub Pages に出す
  id-token: write   # GitHub Pages に出す

concurrency:
  group: daily-watch
  cancel-in-progress: false   # 前の回が終わるまで待つ（重ねない）

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: コード（main）を取り出す
        uses: actions/checkout@v4

      - name: 記録（site ブランチ）を取り出す
        run: |
          git fetch --depth=1 origin site
          git worktree add site origin/site
          cd site && git switch -c site

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 見に行く
        env:
          # 連絡先は Secrets から読む。GitHub は Secrets の値をログで伏せ字にする。スクリプトも表示しない
          GTFS_CONTACT: ${{ secrets.GTFS_CONTACT }}
          FULL: ${{ github.event.schedule == '47 18 * * 6' || inputs.full == true }}
        run: |
          if [ -z "$GTFS_CONTACT" ]; then echo "Secrets に GTFS_CONTACT がありません"; exit 1; fi
          test -f site/state/versions_seen.csv || { echo "site ブランチに記録がありません（最初の1回は手元で作る）"; exit 1; }
          if [ "$FULL" = "true" ]; then python3 scripts/07_daily_watch.py --site site --full
          else python3 scripts/07_daily_watch.py --site site; fi

      - name: 記録を site ブランチにコミットする
        if: always()
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "見に行った記録 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin site

      - name: 60日の対策：main に50日コミットが無ければ、中身の無いコミットを1つ入れる
        # 公開リポジトリでは、60日間動きが無いと定時実行が止まる。site ブランチへのコミットが
        # 「動き」に数えられるかは公式の説明で確かめられないので、main にも時々コミットする（案1）
        run: |
          git fetch --depth=1 origin main
          last=$(git log -1 --format=%ct origin/main)
          days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "main の最後のコミットから ${days} 日"
          if [ "$days" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -q -m "定時実行を止めないための中身の無いコミット（main に${days}日コミットが無かったため）"
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
